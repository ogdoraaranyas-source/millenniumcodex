<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Millennium Software Solutions - IDE</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #d4d4d4;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* --- Left Sidebar --- */
        .sidebar {
            width: 260px;
            background-color: #252526;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
        }
        .brand {
            padding: 15px;
            font-size: 14px;
            font-weight: bold;
            color: #4CAF50;
            background-color: #2d2d2d;
            border-bottom: 1px solid #333;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .file-explorer-header {
            padding: 10px 15px;
            font-size: 12px;
            color: #969696;
            text-transform: uppercase;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .new-file-btn {
            background: none;
            border: none;
            color: #4CAF50;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }
        .new-file-btn:hover {
            color: #66bb6a;
        }
        .file-list {
            list-style: none;
            padding: 0;
            margin: 0;
            overflow-y: auto;
            flex: 1;
        }
        .file-item {
            padding: 8px 15px;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .file-item:hover {
            background-color: #2a2d2e;
        }
        .file-item.active {
            background-color: #37373d;
            color: #ffffff;
            border-left: 3px solid #4CAF50;
        }

        /* --- Main Workspace Area --- */
        .main-workspace {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* Top Bar with Run Button */
        .top-bar {
            background-color: #2d2d2d;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #333;
            height: 50px;
        }
        .active-file-indicator {
            font-size: 14px;
            color: #858585;
        }
        .run-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 6px 16px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .run-btn:hover {
            background-color: #45a049;
        }

        /* Split View: Editor & Preview */
        .editor-preview-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 50px);
        }
        .editor-pane {
            width: 50%;
            height: 100%;
            display: flex;
            flex-direction: column;
            border-right: 1px solid #333;
        }
        textarea {
            flex: 1;
            background-color: #1e1e1e;
            color: #d4d4d4;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            padding: 15px;
            border: none;
            resize: none;
            outline: none;
            line-height: 1.5;
        }
        .preview-pane {
            width: 50%;
            height: 100%;
            background-color: white;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Left Sidebar Menu -->
    <div class="sidebar">
        <div class="brand">Millennium Software Solutions</div>
        <div class="file-explorer-header">
            <span>Files</span>
            <button class="new-file-btn" onclick="createNewFile()" title="Create New File">+</button>
        </div>
        <ul id="file-list" class="file-list">
            <!-- Populated dynamically via JavaScript -->
        </ul>
    </div>

    <!-- Main Workspace -->
    <div class="main-workspace">
        <!-- Top Bar with Run Button -->
        <div class="top-bar">
            <span id="active-file-label" class="active-file-indicator">Editing: index.html</span>
            <button class="run-btn" onclick="runProject()">▶ Run</button>
        </div>

        <!-- Split Screen: Editor & Output -->
        <div class="editor-preview-container">
            <!-- Left Side: Code Editor -->
            <div class="editor-pane">
                <textarea id="code-editor" oninput="saveCurrentContent()"></textarea>
            </div>
            <!-- Right Side: Live Output Preview -->
            <div class="preview-pane">
                <iframe id="output-preview"></iframe>
            </div>
        </div>
    </div>

    <script>
        // Virtual File System State
        let projectFiles = {
            "index.html": {
                content: '<!DOCTYPE html>\n<html>\n<head>\n  <link rel="stylesheet" href="style.css">\n</head>\n<body>\n  <h1>Welcome to Millennium IDE</h1>\n  <p>Edit this code and click Run!</p>\n  <script src="script.js"><\/script>\n</body>\n</html>'
            },
            "style.css": {
                content: "body {\n  font-family: sans-serif;\n  background: #f4f4f9;\n  text-align: center;\n  padding-top: 50px;\n}\nh1 {\n  color: #2c3e50;\n}"
            },
            "script.js": {
                content: "console.log('Millennium IDE initialized successfully!');"
            }
        };

        let currentFile = "index.html";

        // Initialize Editor
        function initIDE() {
            renderFileList();
            switchFile("index.html");
            runProject();
        }

        // Render Sidebar File List
        function renderFileList() {
            const fileListEl = document.getElementById("file-list");
            fileListEl.innerHTML = "";
            
            for (let fileName in projectFiles) {
                const li = document.createElement("li");
                li.className = `file-item ${fileName === currentFile ? 'active' : ''}`;
                li.innerHTML = `📄 ${fileName}`;
                li.onclick = () => switchFile(fileName);
                fileListEl.appendChild(li);
            }
        }

        // Switch Between Files
        function switchFile(fileName) {
            // Save current editor text first
            saveCurrentContent();

            currentFile = fileName;
            document.getElementById("code-editor").value = projectFiles[fileName].content;
            document.getElementById("active-file-label").innerText = `Editing: ${fileName}`;
            
            renderFileList();
        }

        // Save Content on Typing
        function saveCurrentContent() {
            projectFiles[currentFile].content = document.getElementById("code-editor").value;
        }

        // Create a New File
        function createNewFile() {
            let fileName = prompt("Enter file name (e.g., about.html, custom.css):");
            if (fileName && fileName.trim() !== "") {
                fileName = fileName.trim();
                if (!projectFiles[fileName]) {
                    projectFiles[fileName] = { content: `/* New file: ${fileName} */\n` };
                    switchFile(fileName);
                } else {
                    alert("File already exists!");
                }
            }
        }

        // Run/Bundle and Render Output in Iframe
        function runProject() {
            saveCurrentContent();

            const html = projectFiles["index.html"] ? projectFiles["index.html"].content : "";
            const css = projectFiles["style.css"] ? projectFiles["style.css"].content : "";
            const js = projectFiles["script.js"] ? projectFiles["script.js"].content : "";

            // Inject CSS and JS dynamically into the HTML frame context
            let bundledCode = html;
            
            // If the user included standard tags, inject styles/scripts cleanly
            if (bundledCode.includes("</head>")) {
                bundledCode = bundledCode.replace("</head>", `<style>${css}</style></head>`);
            } else {
                bundledCode = `<style>${css}</style>` + bundledCode;
            }

            if (bundledCode.includes("</body>")) {
                bundledCode = bundledCode.replace("</body>", `<script>${js}<\/script></body>`);
            } else {
                bundledCode = bundledCode + `<script>${js}<\/script>`;
            }

            // Display in iframe
            const iframe = document.getElementById("output-preview");
            iframe.srcdoc = bundledCode;
        }

        // Run on startup
        window.onload = initIDE;
    </script>
</body>
</html>
